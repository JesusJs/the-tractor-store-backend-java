# Dev profile: local defaults matching compose.yaml; every value can be overridden by env vars.
spring:
  datasource:
    # 127.0.0.1, not localhost: compose.yaml publishes postgres on IPv4 loopback only, and where
    # localhost resolves to ::1 first pgjdbc does not fall back to IPv4 (quickstart troubleshooting).
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:${DB_PORT:5432}/${DB_NAME:tractor}}
    username: ${DB_USER:tractor}
    password: ${DB_PASSWORD:tractor}
