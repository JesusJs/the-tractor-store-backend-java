spring:
  application:
    name: tractor-store-backend
  datasource:
    # No defaults: each profile (or the environment) must provide them.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Milliseconds: Hikari binds directly to HikariDataSource setters (no Duration conversion).
      # Short timeouts make startup fail fast and let readiness notice a dead DB well under 30 s.
      connection-timeout: 5000
      validation-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  jackson:
    # A JSON value of the wrong type is a 400 MALFORMED_REQUEST, never silently converted
    # (FR-017): 1.5 is not truncated to an int and "2" or 12 do not swap text and number.
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          # Flyway owns event_publication (V6); explicit in case events-jdbc is ever added.
          enabled: false
      # Incomplete publications are resubmitted on startup (FR-024, research R13). Only safe with a
      # single replica: several replicas would each resubmit them and deliver duplicates.
      republish-outstanding-events-on-restart: true

logging:
  pattern:
    # Every log line of a request carries its trace id (FR-015, TraceIdFilter).
    level: "%5p [%X{traceId:-}]"

tractorstore:
  cors:
    # Comma separated explicit origins; empty = no browser origin allowed, '*' = startup fails.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  session:
    # ts_session cookie (ADR 0011): Secure only where the site is served over HTTPS (prod).
    secure-cookie: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Management endpoints never appear in the OpenAPI document (FR-019).
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        # Only health is exposed; env, beans, metrics, info... stay unreachable (404).
        include: health
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /readiness also outside Kubernetes.
        enabled: true
      show-details: never
      show-components: never
      group:
        readiness:
          # Readiness depends on the DB; liveness keeps only livenessState.
          include: readinessState,db
