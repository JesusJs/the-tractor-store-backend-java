spring:
  application:
    name: tractor-store-backend
  datasource:
    # No defaults: each profile (or the environment) must provide them.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Management endpoints never appear in the OpenAPI document (FR-019).
  show-actuator: false
